# Réglages de la machine pour run-lot.sh, communs à tous les lots. Copier en run-lot.conf (non versionné), à côté du
# script, ou désigner un autre fichier avec RUN_LOT_CONFIG. Tout est facultatif : les valeurs ci-dessous sont celles
# par défaut, sauf mention contraire.

# PATH des passes (où trouver claude, gh, git, node…). Par défaut : le PATH du lanceur.
# PATH_LOT="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Passes Claude Code simultanées sur la machine, tous lots et tous agents confondus (verrous dans slots/).
# MAX_VOIES=2
# Mémoire disponible exigée au démarrage de chaque passe, en Mio.
# SEUIL_MIO=3072
# Workers de test : passe seule (FIN) et passe d'une voie.
# WORKERS_SEUL=8
# WORKERS_VOIE=4
# Commande Claude Code.
# CLAUDE=claude

# Units systemd des agents (préfixe <agent>-) qui comptent comme jobs lourds extérieurs : elles prennent un créneau.
# AGENTS_RE='^(dev|relecteur)[-0-9]'

# Workflows GitHub Actions des deux dépôts (leurs runs de PR sont mis en pause pendant le lot, puis attendus en fin).
# WORKFLOW_BACK=back.yml
# WORKFLOW_FRONT=front.yml
# Étiquette qui met la CI des PR en pause : les jobs de PR de vos workflows doivent la tester dans leur `if:`.
# PAUSE_CI=ci-en-pause
# Rouges sans rapport avec le code, relancés une fois en fin de lot (expression régulière étendue).
# MOTIFS_NON_CODE='CE Task finished abnormally|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|socket hang up'

# Installation des dépendances dans le worktree de la voie B, quand les deux voies travaillent sur le même dépôt.
# INSTALL_BACK='uv sync -q --all-groups'
# INSTALL_FRONT='pnpm install -s --frozen-lockfile'
# Ce que la passe FIN doit faire tourner, comme la CI (texte repris tel quel dans son cadre).
# SUITE_FIN="back : pytest, ruff, mypy ; front : tsc, eslint, vitest, build et e2e complets"
# Vérification avant chaque poussée (voies) et avant la dernière (FIN), appelée avec le dossier du dépôt et la base
# de comparaison : sortie 0 rien à corriger, 1 à corriger, 2 n'a pas pu tourner. Vide : aucune vérification.
# VERIF="python3 /chemin/verif-avant-push.py"
# VERIF_FIN="python3 /chemin/verif-avant-push.py --audit"

# Textes repris dans les cadres des passes.
# GRILLE="$HOME/agentic-dev/GRILLE-REVUE.md"
# REGLES_ARBITRAGE="$HOME/agentic-dev/regles-arbitrage.md"
# NOM_DEV="l'agent développeur"
# NOM_REV="le relecteur"
# NOM_HUMAIN="l'humain"
# Titres de arbitrages.md : décisions prises par l'agent, réponses de l'humain aux questions [BLOQUANTE].
# TITRE_DECISIONS="Décisions de l'agent"
# TITRE_REPONSES="Réponses de l'humain"

# Trello : identifiants des listes. Vides : aucune carte n'est déplacée. Les clés (TRELLO_API_KEY, TRELLO_TOKEN) se
# passent dans l'environnement du lanceur, jamais dans ce fichier.
# TRELLO_LISTE_WIP=
# TRELLO_LISTE_ATTENTE=
# TRELLO_LISTE_FINIE=

# Attente avant de rejouer une passe qui a échoué en moins de 10 min, en secondes.
# ATTENTE_ECHEC_S=1200

# Ports e2e des deux voies, pour que leurs serveurs de test ne se marchent pas dessus.
# E2E_PORT_A=3123
# E2E_PORT_B=3124
